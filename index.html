<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golf Caddie — Cog Hill</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="./css/style.css"></head><body><div class="wrap"><h1>Line to the pin</h1><p class="sub" id="courseName">Loading course…</p><div class="map-card"><svg id="hole" viewBox="0 0 300 500" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="500" fill="var(--rough)"/><line id="shotLine" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 4"/><circle id="targetDot" r="4.5" fill="var(--accent)" stroke="var(--paper)"/><rect id="teeMarker" width="10" height="8" fill="#8A6A3E"/><circle id="pin" r="2.5" fill="var(--ink)"/><circle id="ball" r="5" fill="#fff" stroke="var(--ink)" stroke-width="1.3"/></svg></div><p class="hint" id="holeMeta">Loading hole data…</p><div class="panel"><div class="stroke-row"><span id="strokeRow">Shot 1</span><label class="stroke-field">Strokes <input type="number" id="strokeInput" min="0" value="0"></label></div><div class="rec"><div><div class="rec-club" id="recClub">Loading…</div><div class="rec-yards"><b id="shotYards">—</b><span id="shotUnit"> yard shot</span></div></div><div class="rec-yards"><b id="remainYards">—</b> to pin</div></div><div class="terrain-row"><span>Terrain: <b id="terrainStatus">Loading…</b></span></div><div class="status" id="statusLine" style="display:none"></div></div><div class="panel"><div class="clubs" id="clubInputs"></div></div><div class="btn-row"><button id="holedBtn" class="secondary">Holed out</button><button id="resetBtn" class="secondary">Reset to tee</button></div></div><script type="module" src="./js/app.js"></script></body></html>
